name: nist-quantum-ready-2030
version: "1.0"
quantum_readiness: required
min_tls_version: "1.3"
allowed_cipher_suites:
  - TLS_AES_256_GCM_SHA384
  - TLS_CHACHA20_POLY1305_SHA256
forbidden_cipher_suites:
  - "*RSA*"
  - "*AES_128*"
  - "*RC4*"
  - "*DES*"
  - "*MD5*"
  - "*SHA1*"
allowed_key_exchange:
  - ML-KEM-512
  - ML-KEM-768
  - ML-KEM-1024
forbidden_key_exchange:
  - RSA
  - DH
  - ECDH
  - X25519
  - X448
  - P-256
  - P-384
  - P-521
  - X25519Kyber768Draft00
allowed_signature_algorithms:
  - ML-DSA-44
  - ML-DSA-65
  - ML-DSA-87
  - SLH-DSA-SHA2-128S
  - SLH-DSA-SHAKE-128S
forbidden_signature_algorithms:
  - RSA
  - DSA
  - ECDSA
  - Ed25519
  - Ed448
  - "*MD5*"
  - "*SHA1*"
allowed_public_key_algorithms:
  - ML-DSA
forbidden_public_key_algorithms:
  - RSA
  - DSA
  - ECDSA
  - Ed25519
  - Ed448
allowed_hashes:
  - SHA-384
  - SHA-512
  - SHA3-384
  - SHA3-512
  - SHAKE256
  - BLAKE2b-512
forbidden_hashes:
  - MD5
  - SHA-1
  - SHA-256
  - SHA3-256
